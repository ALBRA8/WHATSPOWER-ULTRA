# (A5-07) ULTRA en producción: server HTTP + worker persistente con
# reinicio automático (equivalente a supervisor). Comparten db/ —
# SQLite en modo WAL soporta multi-proceso en el MISMO host.
services:
  ultra-server:
    build: .
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file: .env
    volumes:
      - ./db:/app/db
    command: ["node", "--experimental-strip-types", "src/server.ts"]

  ultra-worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./db:/app/db
    command: ["node", "--experimental-strip-types", "src/worker-main.ts"]
