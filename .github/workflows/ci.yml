name: CI WHATSPOWER-ULTRA
on:
  push:
    branches: [main, 'impl/**', 'fix/**', 'repair/**']
  pull_request:
    branches: [main, 'impl/**', 'fix/**', 'repair/**']

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: TypeScript & Static Check (fail-fast)
        run: npm run tsc
      - name: Lint
        run: npm run lint
      - name: Build (compilación de producción hacia dist/)
        run: npm run build
      - name: Auditoría de dependencias (npm audit)
        run: npm run audit
      - name: Escáner de secretos en árbol de trabajo
        run: npm run security:scan
      - name: Escáner de secretos en historial Git
        run: npm run security:scan:history
      - name: Suite completa de pruebas (incluye AUTH, ORG, OWN, WH, TR, ENV, circuito de bajas y autenticación real)
        run: npm test
        env:
          NODE_ENV: test
          ADMIN_API_KEYS: ci-only-ultra-admin-key-0000000000:org_ci
